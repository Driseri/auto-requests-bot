services:
  bot:
    env_file:
      - path: .env.local
        required: true
    environment:
      SQLITE_PATH: /data/local-app.db
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-false}
      GIGACHAT_SYSTEM_PROMPT_PATH: ${GIGACHAT_SYSTEM_PROMPT_PATH:-prompts/gigachat_system_v5_recommendation.md}
      GIGACHAT_USER_PROMPT_PATH: ${GIGACHAT_USER_PROMPT_PATH:-prompts/gigachat_user_v5_recommendation.md}
