name: alfa-auto-requests

services:
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /data/app.db
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google_credentials.json
      GIGACHAT_SYSTEM_PROMPT_PATH: ${GIGACHAT_SYSTEM_PROMPT_PATH:-prompts/gigachat_system_v6.2_recommendation.md}
      GIGACHAT_USER_PROMPT_PATH: ${GIGACHAT_USER_PROMPT_PATH:-prompts/gigachat_user_v6.1_recommendation.md}
      MALLOC_ARENA_MAX: "2"
      TZ: ${BOT_TIMEZONE:-Europe/Moscow}
    volumes:
      - bot-data:/data
      - ./credentials.json:/run/secrets/google_credentials.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    build: .
    profiles: ["maintenance"]
    environment:
      SQLITE_PATH: /data/app.db
    volumes:
      - bot-data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    command:
      - python
      - -m
      - app.maintenance
      - backup
      - --source
      - /data/app.db
      - --directory
      - /backups
      - --retention-days
      - "7"
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
