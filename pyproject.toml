[project]
name = "alfa-auto-requests"
version = "0.1.0"
description = "MVP Telegram bot for collecting chatbot answer change requests"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.6,<4.0",
    "aiohttp-socks>=0.9,<1.0",
    "aiosqlite>=0.20,<1.0",
    "google-api-python-client>=2.130,<3.0",
    "google-auth>=2.30,<3.0",
    "requests>=2.31,<3.0",
    "gigachat>=0.2.1,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
